    model: ${STREAMEVAL_AURA_MODEL:Aura}
    video_transport: path
    max_video_length_in_seconds: 60.2
    max_new_tokens: 1024
    temperature: 0.0
    timeout: 600
    max_retries: 3

  gemini_3_pro:
    backend: gemini_native
    api_base: ${STREAMEVAL_GEMINI_3_API_BASE:https://generativelanguage.googleapis.com}
    api_key: ${STREAMEVAL_GEMINI_3_API_KEY:EMPTY}
    model: ${STREAMEVAL_GEMINI_3_MODEL:gemini-3-pro-preview}
    max_video_size_mb: 30
    video_metadata_fps: 1.0
    max_video_length_in_seconds: 60.2
    max_new_tokens: 1024
    temperature: 0.0
    timeout: 600
    max_retries: 3

  zhizengzeng_chat:
    # Assume Zhizengzeng provides OpenAI-compatible chat/completions API.
    # If your service uses a different path/protocol, adjust backend/request mapping in run_stream_eval.py.
    backend: zhizengzeng
    api_base: ${STREAMEVAL_ZHIZENGZENG_API_BASE:https://api.zhizengzeng.com/v1}
    api_key: ${STREAMEVAL_ZHIZENGZENG_API_KEY:EMPTY}
    model: ${STREAMEVAL_ZHIZENGZENG_MODEL:your-zhizengzeng-model}
    video_transport: image_frames_data_url
    video_frame_count: 2
    video_frame_extract_fps: 2.0
    max_video_size_mb: 30
    max_video_length_in_seconds: 60.2
    max_new_tokens: 1024
    temperature: 0.0
    timeout: ${STREAMEVAL_ZHIZENGZENG_TIMEOUT:600}
    max_retries: ${STREAMEVAL_ZHIZENGZENG_MAX_RETRIES:3}

  openrouter_chat:
    # OpenRouter is OpenAI-compatible for chat/completions.
    backend: openrouter
    api_base: ${STREAMEVAL_OPENROUTER_API_BASE:https://openrouter.ai/api/v1}
    api_key: ${STREAMEVAL_OPENROUTER_API_KEY:EMPTY}
    model: ${STREAMEVAL_OPENROUTER_MODEL:openai/gpt-4o-mini}
    video_transport: image_frames_data_url
    video_frame_count: 2
    video_frame_extract_fps: 2.0
    max_video_size_mb: 30
    max_video_length_in_seconds: 60.2
    max_new_tokens: 1024
    temperature: 0.0
    timeout: 600
    max_retries: 3

judger:
  # The judger request format is OpenAI-compatible. You can point api_base/api_key/model
  # to OpenRouter or Zhizengzeng endpoints without code changes.
  backend: ${STREAMEVAL_JUDGER_BACKEND:openai_compatible}
  api_base: ${STREAMEVAL_JUDGER_API_BASE:http://127.0.0.1:8000/v1}
  api_key: ${STREAMEVAL_JUDGER_API_KEY:EMPTY}
  model: ${STREAMEVAL_JUDGER_MODEL:Qwen/Qwen3-32B-Instruct}
  max_new_tokens: 256
  temperature: 0.0
  timeout: 120
  max_retries: 3
  prompt_template: |
    You are an expert evaluator judging whether a model's answer provides a reasonable and factually plausible explanation that directly addresses the question, based on the reference answer.

    Evaluation Guideline:
    - Focus on whether the model gives a coherent reason that logically explains what the question asks.
    - The answer does not need to reproduce all details from the reference.
    - Penalize only if the explanation is factually wrong, meaningless, or irrelevant.

    Scoring (integer 0-5):
    - 5: fully accurate and complete.
    - 4: correct and sufficient.
    - 3: partially relevant.
    - 2: tangential/speculative.
    - 1: factually incorrect.
    - 0: no attempt/off-topic.

    Output format:
    Return valid JSON with keys:
    - "explanation"
    - "score"

    Question: {question}
    Predicted Answer: {model_output}
    Correct Answer: {reference_answer}

scoring:
  forward_task_types:
    - forward
    - future
    - proactive
  placeholder_responses:
    - ""
    - "silent"
    - "<NO_INFORMATION>"
    - "<SILENT>"
    - "Alright, I'll send you a reminder then."
    - "Got it, I'll let you know at that moment."
    - "got it, i'll let you know."
    - "Understood, I will remind you when the time comes."
    - "No problem, I'll remind you then."
    - "Okay, I will alert you when it happens."
    - "I will make sure to remind you at that time."
    - "Sure, I will let you know at that time."
    - "Noted, expect a reminder from me then."
    - "Ok, I will remind you then."
    - "Certainly, I will provide the reminder then."
    - "No problem, I'll remind you then."
    - "ok"
    - "okay"
    - "sure"
    - "yes"
    - "got it, i will notify you at that moment."
